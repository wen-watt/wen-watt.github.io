# Checks every external link on the sources page from GitHub's own servers.
# Runs by hand (Actions -> Check links -> Run workflow) and every Monday.
# The report appears on the run page under "Summary". It never blocks the site.
name: Check links

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check links on the sources page
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --timeout 25
            --max-retries 2
            --accept 200..=299,403,429
            --exclude '^https?://(www\.)?(x|twitter)\.com'
            --exclude '^https?://(www\.)?tiktok\.com'
            --exclude '^https?://fonts\.(googleapis|gstatic)\.com'
            --exclude-path assets
            sources.html
          fail: false
          jobSummary: true

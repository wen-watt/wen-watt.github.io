# Reads the WEN mint from Solana mainnet (read-only) and shows the owner program,
# authorities and extensions on the run page under "Summary".
# Run by hand: Actions -> Check WEN mint -> Run workflow. Also runs every Monday.
name: Check WEN mint

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read the WEN mint from mainnet
        run: node tools/check-wen-mint.mjs
